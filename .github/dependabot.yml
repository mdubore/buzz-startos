version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:17'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:47'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: ci
