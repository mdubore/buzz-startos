name: Release

on:
  push:
    tags:
      - 'v*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag and notes
        run: |
          VERSION="$(
            grep -oP "version:\s*['\"]\K[^'\"]+" startos/versions/current.ts
          )"
          test -n "$VERSION"
          EXPECTED_TAG="v${VERSION//:/_}"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test -s "docs/releases/${GITHUB_REF_NAME}.md"

  signed-package:
    needs: preflight
    uses: ./.github/workflows/package.yml
    with:
      signed_release: true

  reserve-release:
    needs: signed-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reserve create-once release identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES_FILE="$GITHUB_WORKSPACE/docs/releases/${GITHUB_REF_NAME}.md"
          test -s "$NOTES_FILE"
          set +e
          EXISTING="$(
            gh api \
              "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" 2>&1
          )"
          STATUS=$?
          set -e
          if [[ "$STATUS" -eq 0 ]]; then
            printf 'release identity is already reserved: %s\n' \
              "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$EXISTING" != *'HTTP 404'* ]]; then
            printf 'could not prove the release identity is unused\n' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --prerelease \
            --notes-file "$NOTES_FILE"

  signed-build:
    needs: reserve-release
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target: [x86, arm]
        include:
          - target: x86
            archive: buzz_x86_64.s9pk
            artifact: buzz-x86
          - target: arm
            archive: buzz_aarch64.s9pk
            artifact: buzz-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            curl \
            git \
            jq \
            make \
            openssl \
            squashfs-tools \
            squashfs-tools-ng \
            xxd
          command -v mksquashfs
          command -v tar2sqfs
          command -v openssl
          command -v xxd

      - name: Install Start CLI 1.1.0
        run: |
          START_CLI_TMP="$(mktemp)"
          trap 'rm -f "$START_CLI_TMP"' EXIT
          curl -fL \
            'https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v1.1.0/start-cli_x86_64-linux' \
            -o "$START_CLI_TMP"
          printf '%s  %s\n' \
            '70eff67b6e9a936acd8aaaf787b783819252ecedaa5c74d462e3b15ed4dd843a' \
            "$START_CLI_TMP" | sha256sum --check
          sudo install -Dm755 "$START_CLI_TMP" /usr/local/bin/start-cli
          test "$(start-cli --version)" = 'start-cli 1.1.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Compile package entrypoint
        run: npm run build

      - name: Prepare protected signer paths
        run: |
          umask 077
          mkdir -p "$HOME/.startos" "$GITHUB_WORKSPACE/.startos"
          chmod 0700 "$HOME/.startos" "$GITHUB_WORKSPACE/.startos"

      - name: Build signed ${{ matrix.target }} package
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          ./scripts/with-release-signer.sh \
            "$HOME/.startos/id.key.pem" \
            "$GITHUB_WORKSPACE/.startos/build.key.pem" \
            make "${{ matrix.target }}"

      - name: Verify package output
        run: |
          shopt -s nullglob
          archives=(*.s9pk)
          test "${#archives[@]}" -eq 1
          test "${archives[0]}" = '${{ matrix.archive }}'
          test -s '${{ matrix.archive }}'

      - name: Verify package signer
        run: ./scripts/verify-s9pk-signer.sh '${{ matrix.archive }}'

      - name: Print package checksum
        run: sha256sum -- '${{ matrix.archive }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove protected signing identity
        if: ${{ always() }}
        run: |
          rm -f \
            "$HOME/.startos/id.key.pem" \
            "$GITHUB_WORKSPACE/.startos/build.key.pem"
          rmdir "$HOME/.startos" "$GITHUB_WORKSPACE/.startos" 2>/dev/null || true

  assemble-release:
    needs: signed-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buzz-x86
          path: downloads/packages/buzz-x86

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buzz-arm
          path: downloads/packages/buzz-arm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-vulnerability-reports
          path: downloads/scans

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-sboms
          path: downloads/sboms

      - name: Install release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            curl \
            openssl \
            xxd
          TOOLS_TMP="$(mktemp -d)"
          trap 'rm -rf "$TOOLS_TMP"' EXIT
          START_CLI_TMP="$TOOLS_TMP/start-cli"
          curl -fL \
            'https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v1.1.0/start-cli_x86_64-linux' \
            -o "$START_CLI_TMP"
          printf '%s  %s\n' \
            '70eff67b6e9a936acd8aaaf787b783819252ecedaa5c74d462e3b15ed4dd843a' \
            "$START_CLI_TMP" | sha256sum --check
          sudo install -Dm755 "$START_CLI_TMP" /usr/local/bin/start-cli
          test "$(start-cli --version)" = 'start-cli 1.1.0'

          CYCLONEDX_TMP="$TOOLS_TMP/cyclonedx"
          curl -fL \
            'https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64' \
            -o "$CYCLONEDX_TMP"
          printf '%s  %s\n' \
            '454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1' \
            "$CYCLONEDX_TMP" | sha256sum --check
          sudo install -Dm755 "$CYCLONEDX_TMP" /usr/local/bin/cyclonedx
          test "$(cyclonedx --version)" = \
            '0.32.0+0ed788d25c13cef9e9a3029603f6b708e3279390'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Assemble and verify closed release artifact set
        run: |
          VERSION="$(
            grep -oP "version:\s*['\"]\K[^'\"]+" startos/versions/current.ts
          )"
          test -n "$VERSION"
          EXPECTED_TAG="v${VERSION//:/_}"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
          PACKAGE_DIR="$RUNNER_TEMP/release-packages"
          ARTIFACT_DIR="$RUNNER_TEMP/release-artifacts"
          rm -rf "$PACKAGE_DIR"
          rm -rf "$ARTIFACT_DIR"
          install -d -m 0700 "$PACKAGE_DIR"
          install -d -m 0700 "$ARTIFACT_DIR"
          test "$(
            find downloads/packages/buzz-x86 -type f -name 'buzz_x86_64.s9pk' |
              wc -l
          )" -eq 1
          test "$(
            find downloads/packages/buzz-arm -type f -name 'buzz_aarch64.s9pk' |
              wc -l
          )" -eq 1
          test "$(find downloads/packages -type f -name '*.s9pk' | wc -l)" -eq 2
          find downloads/packages -type f -name '*.s9pk' \
            -exec cp '{}' "$PACKAGE_DIR/" \;
          ./scripts/prepare-release-assets.sh \
            "$PACKAGE_DIR" \
            "$GITHUB_WORKSPACE/downloads/scans" \
            "$GITHUB_WORKSPACE/downloads/sboms" \
            "$ARTIFACT_DIR" \
            "$GITHUB_REF_NAME" \
            "$VERSION" \
            "$GITHUB_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Remove assembled release artifacts
        if: ${{ always() }}
        run: |
          rm -rf \
            "$RUNNER_TEMP/release-packages" \
            "$RUNNER_TEMP/release-artifacts"

  attest-release:
    needs: assemble-release
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Attest exact release artifact bytes
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/*

  verify-attested-release:
    needs: attest-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-artifacts

      - name: Install release verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            curl \
            openssl \
            xxd
          TOOLS_TMP="$(mktemp -d)"
          trap 'rm -rf "$TOOLS_TMP"' EXIT
          START_CLI_TMP="$TOOLS_TMP/start-cli"
          curl -fL \
            'https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v1.1.0/start-cli_x86_64-linux' \
            -o "$START_CLI_TMP"
          printf '%s  %s\n' \
            '70eff67b6e9a936acd8aaaf787b783819252ecedaa5c74d462e3b15ed4dd843a' \
            "$START_CLI_TMP" | sha256sum --check
          sudo install -Dm755 "$START_CLI_TMP" /usr/local/bin/start-cli
          test "$(start-cli --version)" = 'start-cli 1.1.0'

          CYCLONEDX_TMP="$TOOLS_TMP/cyclonedx"
          curl -fL \
            'https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64' \
            -o "$CYCLONEDX_TMP"
          printf '%s  %s\n' \
            '454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1' \
            "$CYCLONEDX_TMP" | sha256sum --check
          sudo install -Dm755 "$CYCLONEDX_TMP" /usr/local/bin/cyclonedx
          test "$(cyclonedx --version)" = \
            '0.32.0+0ed788d25c13cef9e9a3029603f6b708e3279390'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Reverify release tag and artifact set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(
            grep -oP "version:\s*['\"]\K[^'\"]+" startos/versions/current.ts
          )"
          test -n "$VERSION"
          EXPECTED_TAG="v${VERSION//:/_}"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
          ./scripts/verify-release-assets.sh \
            "$RUNNER_TEMP/release-artifacts" \
            "$GITHUB_REF_NAME" \
            "$VERSION" \
            "$GITHUB_SHA"
          while IFS= read -r -d '' asset; do
            gh attestation verify "$asset" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --signer-digest "$GITHUB_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done < <(
            find "$RUNNER_TEMP/release-artifacts" \
              -mindepth 1 \
              -maxdepth 1 \
              -type f \
              -print0
          )

      - name: Remove verified release artifacts
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/release-artifacts"

  finalize-prerelease:
    needs: verify-attested-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-artifacts

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/release-artifacts"
          test "$(
            gh release view "$GITHUB_REF_NAME" \
              --json isDraft \
              --jq '.isDraft'
          )" = 'true'
          gh release upload "$GITHUB_REF_NAME" \
            "$ARTIFACT_DIR"/*
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --prerelease

      - name: Remove prepared release artifacts
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/release-artifacts"
