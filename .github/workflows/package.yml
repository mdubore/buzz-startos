name: Package

on:
  workflow_call:
    inputs:
      signed_release:
        description: Run release verification without ephemeral package builds
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            curl \
            git \
            jq \
            make \
            openssl \
            squashfs-tools \
            squashfs-tools-ng \
            xxd
          command -v mksquashfs
          command -v tar2sqfs
          command -v openssl
          command -v xxd

      - name: Install Start CLI 1.1.0
        run: |
          START_CLI_TMP="$(mktemp)"
          trap 'rm -f "$START_CLI_TMP"' EXIT
          curl -fL \
            'https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v1.1.0/start-cli_x86_64-linux' \
            -o "$START_CLI_TMP"
          printf '%s  %s\n' \
            '70eff67b6e9a936acd8aaaf787b783819252ecedaa5c74d462e3b15ed4dd843a' \
            "$START_CLI_TMP" | sha256sum --check
          sudo install -Dm755 "$START_CLI_TMP" /usr/local/bin/start-cli
          test "$(start-cli --version)" = 'start-cli 1.1.0'

      - name: Install Docker Buildx 0.35.0
        run: |
          BUILDX_TMP="$(mktemp)"
          trap 'rm -f "$BUILDX_TMP"' EXIT
          curl -fL \
            'https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64' \
            -o "$BUILDX_TMP"
          printf '%s  %s\n' \
            'd41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda' \
            "$BUILDX_TMP" | sha256sum --check
          install -Dm755 \
            "$BUILDX_TMP" \
            "$HOME/.docker/cli-plugins/docker-buildx"
          BUILDX_VERSION="$(docker buildx version)"
          printf '%s\n' "$BUILDX_VERSION"
          test "$(printf '%s\n' "$BUILDX_VERSION" | awk '{print $2}')" = 'v0.35.0'
          test "$(
            docker buildx inspect default |
              awk '$1 == "Driver:" { print $2; exit }'
          )" = 'docker'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify npm registry signatures
        run: npm run audit:signatures

      - name: Run unit tests
        run: npm test

      - name: Run type checks
        run: npm run check

      - name: Run Start SDK lint
        run: node node_modules/@start9labs/start-sdk/lint.mjs

      - name: Check formatting
        run: npm run prettier:check

      - name: Compile package entrypoint
        run: npm run build

      - name: Enforce npm vulnerability policy
        run: npm run audit:vulnerabilities

      - name: Verify immutable image inputs
        run: npm run verify:images

      - name: Check patches
        run: git diff --check

  runtime-risk:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Grype 0.116.0
        run: |
          GRYPE_TMP="$(mktemp -d)"
          GRYPE_ARCHIVE="$GRYPE_TMP/grype.tar.gz"
          curl -fL \
            'https://github.com/anchore/grype/releases/download/v0.116.0/grype_0.116.0_linux_amd64.tar.gz' \
            -o "$GRYPE_ARCHIVE"
          printf '%s  %s\n' \
            '40aff724297312f91ea390d003bed8d8651c74cc7f5b26732db80b3a408d2fc5' \
            "$GRYPE_ARCHIVE" | sha256sum --check
          tar -xzf "$GRYPE_ARCHIVE" -C "$GRYPE_TMP" grype
          install -Dm755 "$GRYPE_TMP/grype" "$HOME/.local/bin/grype"
          test "$(
            "$HOME/.local/bin/grype" version |
              awk '$1 == "Version:" { print $2; exit }'
          )" = '0.116.0'
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Scan immutable runtime images
        run: npm run scan:images -- runtime-scan-results

      - name: Retain runtime vulnerability reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-vulnerability-reports
          path: runtime-scan-results
          if-no-files-found: error
          retention-days: 30

  runtime-sbom:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Syft 1.49.0
        run: |
          SYFT_TMP="$(mktemp -d)"
          trap 'rm -rf "$SYFT_TMP"' EXIT
          curl -fL \
            'https://github.com/anchore/syft/releases/download/v1.49.0/syft_1.49.0_linux_amd64.tar.gz' \
            -o "$SYFT_TMP/syft.tar.gz"
          printf '%s  %s\n' \
            '7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe' \
            "$SYFT_TMP/syft.tar.gz" | sha256sum --check
          tar -xzf "$SYFT_TMP/syft.tar.gz" -C "$SYFT_TMP" syft
          install -Dm755 "$SYFT_TMP/syft" "$HOME/.local/bin/syft"
          test "$("$HOME/.local/bin/syft" version -o json | jq -r '.version')" = '1.49.0'
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Install CycloneDX CLI 0.32.0
        run: |
          CYCLONEDX_TMP="$(mktemp)"
          trap 'rm -f "$CYCLONEDX_TMP"' EXIT
          curl -fL \
            'https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64' \
            -o "$CYCLONEDX_TMP"
          printf '%s  %s\n' \
            '454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1' \
            "$CYCLONEDX_TMP" | sha256sum --check
          install -Dm755 "$CYCLONEDX_TMP" "$HOME/.local/bin/cyclonedx"
          test "$("$HOME/.local/bin/cyclonedx" --version)" = \
            '0.32.0+0ed788d25c13cef9e9a3029603f6b708e3279390'
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Generate canonical release SBOMs
        run: ./scripts/generate-sboms.sh runtime-sboms

      - name: Retain runtime SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-sboms
          path: runtime-sboms
          if-no-files-found: error
          retention-days: 30

  ephemeral-build:
    if: ${{ inputs.signed_release == false }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86, arm]
        include:
          - target: x86
            archive: buzz_x86_64.s9pk
            artifact: buzz-x86
          - target: arm
            archive: buzz_aarch64.s9pk
            artifact: buzz-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            curl \
            git \
            jq \
            make \
            openssl \
            squashfs-tools \
            squashfs-tools-ng \
            xxd
          command -v mksquashfs
          command -v tar2sqfs
          command -v openssl
          command -v xxd

      - name: Install Start CLI 1.1.0
        run: |
          START_CLI_TMP="$(mktemp)"
          trap 'rm -f "$START_CLI_TMP"' EXIT
          curl -fL \
            'https://github.com/Start9Labs/start-technologies/releases/download/start-cli/v1.1.0/start-cli_x86_64-linux' \
            -o "$START_CLI_TMP"
          printf '%s  %s\n' \
            '70eff67b6e9a936acd8aaaf787b783819252ecedaa5c74d462e3b15ed4dd843a' \
            "$START_CLI_TMP" | sha256sum --check
          sudo install -Dm755 "$START_CLI_TMP" /usr/local/bin/start-cli
          test "$(start-cli --version)" = 'start-cli 1.1.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Compile package entrypoint
        run: npm run build

      - name: Provision ephemeral signing identity
        run: |
          umask 077
          mkdir -p "$HOME/.startos"
          chmod 0700 "$HOME/.startos"
          start-cli init-key
          test -s "$HOME/.startos/id.key.pem"
          mkdir -p "$GITHUB_WORKSPACE/.startos"
          chmod 0700 "$GITHUB_WORKSPACE/.startos"
          cp \
            "$HOME/.startos/id.key.pem" \
            "$GITHUB_WORKSPACE/.startos/build.key.pem"
          chmod 0600 "$GITHUB_WORKSPACE/.startos/build.key.pem"

      - name: Build ${{ matrix.target }} package
        run: make "${{ matrix.target }}"

      - name: Verify package output
        run: |
          shopt -s nullglob
          archives=(*.s9pk)
          test "${#archives[@]}" -eq 1
          test "${archives[0]}" = '${{ matrix.archive }}'
          test -s '${{ matrix.archive }}'
          sha256sum -- '${{ matrix.archive }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove ephemeral signing identity
        if: ${{ always() }}
        run: |
          rm -f \
            "$HOME/.startos/id.key.pem" \
            "$GITHUB_WORKSPACE/.startos/build.key.pem"
          rmdir "$HOME/.startos" "$GITHUB_WORKSPACE/.startos" 2>/dev/null || true
